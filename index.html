<script>
// 1. INITIALIZATION & STATE MANAGEMENT
const SUPABASE_URL = "YOUR_SUPABASE_URL"; 
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let localPatientsStore = [];
let selectedTriageFilter = 'all';
let selectedDeptFilter = 'all';
let activeTriageSelection = null;
let currentSelectedPatientId = null;

// Initialize System on load
document.addEventListener("DOMContentLoaded", () => {
    initClock();
    connectSupabaseRealtime();
    fetchInitialData();
});

// Real-time Clock Interface
function initClock() {
    const updateTime = () => {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];
        if(document.getElementById('clock')) document.getElementById('clock').innerText = timeStr.substring(0,5);
        if(document.getElementById('tv-clock')) document.getElementById('tv-clock').innerText = timeStr;
    };
    updateTime();
    setInterval(updateTime, 1000);
}

// 2. REALTIME SUBSTREAM PIPELINE
function connectSupabaseRealtime() {
    const banner = document.getElementById('conn-banner');
    const statusLabel = document.getElementById('conn-status');
    
    const patientChannel = supabase.channel('schema-db-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'patients' }, (payload) => {
            handleRealtimeBroadcast(payload);
        })
        .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                if(banner) banner.classList.remove('show');
                if(statusLabel) statusLabel.innerText = "connected";
                document.getElementById('rt-status').innerText = "Live";
            } else {
                if(banner) banner.classList.add('show');
                if(statusLabel) statusLabel.innerText = "reconnecting...";
                document.getElementById('rt-status').innerText = "Offline";
            }
        });
}

async function fetchInitialData() {
    const { data, error } = await supabase
        .from('patients')
        .select('*')
        .order('created_at', { ascending: true });

    if (error) {
        showToast("Error retrieving data asset infrastructure.");
        return;
    }
    localPatientsStore = data;
    processAndRenderUI();
}

function handleRealtimeBroadcast(payload) {
    if (payload.eventType === 'INSERT') {
        localPatientsStore.push(payload.new);
        triggerPushAlert(payload.new);
    } else if (payload.eventType === 'UPDATE') {
        const idx = localPatientsStore.findIndex(p => p.id === payload.new.id);
        if (idx !== -1) localPatientsStore[idx] = payload.new;
    } else if (payload.eventType === 'DELETE') {
        localPatientsStore = localPatientsStore.filter(p => p.id === payload.old.id);
    }
    processAndRenderUI();
}

function triggerPushAlert(newPatient) {
    if(newPatient.triage_category === 'critical') {
        const notif = document.getElementById('sys-notif');
        document.getElementById('notif-title').innerText = "🚨 Emergency Red Alert";
        document.getElementById('notif-msg').innerText = `${newPatient.first_name} ${newPatient.surname} registered with severe immediate risk profile.`;
        if(notif) {
            notif.style.display = 'block';
            setTimeout(() => notif.style.display = 'none', 6000);
        }
    }
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthQueue — Live</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#0d0f0e; --surface:#141716; --surface2:#1a1d1b; --surface3:#1f2320;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#edecea; --text2:#9a9792; --text3:#5a5855;
  --green:#4ade80; --green-dim:#162b1e; --green-mid:#22c55e;
  --amber:#fbbf24; --amber-dim:#2d2009;
  --red:#f87171; --red-dim:#2b1212;
  --blue:#60a5fa; --blue-dim:#0d1f38;
  --purple:#c084fc; --purple-dim:#200f35;
  --teal:#2dd4bf;
  --radius:11px; --radius-sm:7px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
::-webkit-scrollbar{width:3px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* layout */
.app{display:flex;height:100vh;overflow:hidden;}

/* sidebar */
.sidebar{width:214px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--border);}
.brand-row{display:flex;align-items:center;gap:9px;margin-bottom:5px;}
.brand-icon{width:28px;height:28px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-icon svg{width:14px;height:14px;}
.brand-name{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.3px;}
.brand-clinic{font-size:11px;color:var(--text3);padding-left:37px;}
.live-row{display:flex;align-items:center;gap:6px;padding-left:37px;margin-top:4px;}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pdot 2s ease-in-out infinite;}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.8);}}
.live-txt{font-size:10px;color:var(--green);font-family:'DM Mono',monospace;letter-spacing:.07em;text-transform:uppercase;}
.nav-section{padding:13px 18px 4px;font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;font-family:'Syne',sans-serif;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13px;color:var(--text2);cursor:pointer;border-left:2px solid transparent;transition:all .12s;user-select:none;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{color:var(--green);border-left-color:var(--green);background:rgba(74,222,128,.06);font-weight:500;}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.6;}
.nav-item.active svg{opacity:1;}
.nav-badge{margin-left:auto;background:var(--red);color:var(--bg);font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;font-family:'DM Mono',monospace;}
.sidebar-foot{margin-top:auto;padding:13px 18px;border-top:1px solid var(--border);}
.foot-name{font-size:13px;font-weight:500;}
.foot-role{font-size:11px;color:var(--text3);margin-top:1px;}

/* main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 22px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.page-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:-.2px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2);padding:4px 10px;border-radius:20px;font-family:'DM Mono',monospace;}
.rpulse{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pdot 1.5s ease-in-out infinite;}
.clock{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);padding:4px 10px;border-radius:var(--radius-sm);}
.content{flex:1;overflow-y:auto;padding:18px 22px;}

/* pages */
.page{display:none;} .page.active{display:block;}

/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.card-header{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text2);text-transform:uppercase;display:flex;align-items:center;gap:7px;}
.card-title svg{width:14px;height:14px;}
.card-body{padding:16px;}

/* metrics */
.metrics-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac,var(--green));opacity:.6;}
.metric-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;font-family:'Syne',sans-serif;margin-bottom:8px;}
.metric-value{font-family:'Syne',sans-serif;font-size:30px;font-weight:700;color:var(--text);line-height:1;}
.metric-value.red{color:var(--red);} .metric-value.amber{color:var(--amber);} .metric-value.green{color:var(--green);} .metric-value.blue{color:var(--blue);}
.metric-sub{font-size:10px;color:var(--text3);margin-top:6px;font-family:'DM Mono',monospace;}

/* btn */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .12s;font-family:'DM Sans',sans-serif;}
.btn:hover{background:var(--surface3);color:var(--text);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--green);color:var(--bg);border-color:var(--green);font-weight:700;}
.btn-primary:hover{background:var(--green-mid);}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn svg{width:13px;height:13px;}

/* table */
.qtable{width:100%;border-collapse:collapse;}
.qtable th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface2);font-family:'Syne',sans-serif;}
.qtable td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}

/* form */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg.full{grid-column:1/-1;}
.flabel{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-family:'Syne',sans-serif;}
.finput{border:1px solid var(--border2);border-radius:var(--radius-sm);padding:8px 11px;background:var(--surface2);color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .12s;width:100%;}
.finput:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.08);}
textarea.finput{resize:vertical;min-height:68px;}

/* triage selector */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.tcard{border:1px solid var(--border2);border-radius:var(--radius);padding:13px 10px;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface2);}
.tcard:hover{transform:translateY(-1px);}
.tcard.selected{border-width:2px;}
.tcard.selected.critical{border-color:var(--red);background:var(--red-dim);}
.tcard.selected.urgent{border-color:var(--amber);background:var(--amber-dim);}
.tcard.selected.routine{border-color:var(--green);background:var(--green-dim);}
.tcard.selected.booked{border-color:var(--blue);background:var(--blue-dim);}
.tcard-emoji{font-size:20px;margin-bottom:5px;}
.tcard-label{font-size:12px;font-weight:700;font-family:'Syne',sans-serif;}
.tcard-desc{font-size:10px;color:var(--text3);margin-top:2px;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.flex-gap{display:flex;align-items:center;gap:8px;}
.mb10{margin-bottom:10px;} .mb14{margin-bottom:14px;}

/* info badge */
.ib-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(45,212,191,.1);color:var(--teal);border:1px solid rgba(45,212,191,.2);font-family:'DM Mono',monospace;}
</style>
</head>
<body>

<div class="app">

  <div class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0d0f0e" stroke-width="2.5"><rect x="11" y="7" width="2" height="10"/><rect x="7" y="11" width="10" height="2"/><circle cx="12" cy="12" r="9"/></svg>
        </div>
        <span class="brand-name">HealthQueue</span>
      </div>
      <div class="brand-clinic">Mogale City Clinic</div>
      <div class="live-row">
        <span class="live-dot"></span>
        <span class="live-txt" id="conn-status">Connected</span>
      </div>
    </div>

    <span class="nav-section">Reception</span>
    <div class="nav-item active" onclick="nav('register')">Register Patient</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="page-title">HealthQue-V3 Portal</div>
      <div class="topbar-right">
        <div class="status-pill"><span class="rpulse"></span><span>Live</span></div>
      </div>
    </div>

    <div class="content">
      <div class="page active" id="page-register">
        <div class="two-col">
          
          <div class="card">
            <div class="card-header"><div class="card-title">Patient details</div></div>
            <div class="card-body">
              <div class="fgrid mb14">
                <div class="fg"><label class="flabel">First name *</label><input class="finput" id="r-first" placeholder="e.g. Thandi"></div>
                <div class="fg"><label class="flabel">Surname *</label><input class="finput" id="r-last" placeholder="e.g. Mokoena"></div>
                <div class="fg"><label class="flabel">SA ID / Passport</label><input class="finput" id="r-id" placeholder="13-digit ID"></div>
                <div class="fg"><label class="flabel">Date of birth</label><input class="finput" id="r-dob" type="date"></div>
                <div class="fg"><label class="flabel">Phone (SMS/WhatsApp) *</label><input class="finput" id="r-phone" placeholder="07x xxx xxxx"></div>
                <div class="fg"><label class="flabel">Gender</label>
                  <select class="finput" id="r-gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option></select>
                </div>
                <div class="fg full"><label class="flabel">Chief complaint *</label><textarea class="finput" id="r-complaint" placeholder="Describe main symptoms…"></textarea></div>
                <div class="fg"><label class="flabel">Department</label>
                  <select class="finput" id="r-dept"><option>General</option><option>Emergency</option><option>Chronic</option></select>
                </div>
                <div class="fg"><label class="flabel">Visit type</label>
                  <select class="finput" id="r-type"><option>Walk-in</option><option>Pre-booked</option></select>
                </div>
              </div>
            </div>
          </div>

          <div>
            <div class="card mb10">
              <div class="card-header"><div class="card-title">Triage category *</div></div>
              <div class="card-body">
                <div class="tgrid">
                  <div class="tcard" id="tc-critical" onclick="selTriage('Critical')"><div class="tcard-emoji">🔴</div><div class="tcard-label" style="color:var(--red)">Critical</div></div>
                  <div class="tcard" id="tc-urgent" onclick="selTriage('Urgent')"><div class="tcard-emoji">🟠</div><div class="tcard-label" style="color:var(--amber)">Urgent</div></div>
                  <div class="tcard" id="tc-routine" onclick="selTriage('Routine')"><div class="tcard-emoji">🟢</div><div class="tcard-label" style="color:var(--green)">Routine</div></div>
                  <div class="tcard" id="tc-booked" onclick="selTriage('Pre-booked')"><div class="tcard-emoji">🔵</div><div class="tcard-label" style="color:var(--blue)">Pre-booked</div></div>
                </div>
              </div>
            </div>

            <div class="card mb10">
              <div class="card-header"><div class="card-title">Quick vitals</div></div>
              <div class="card-body">
                <div class="fgrid">
                  <div class="fg"><label class="flabel">Blood pressure</label><input class="finput" id="r-bp" placeholder="140/90"></div>
                  <div class="fg"><label class="flabel">Temp °C</label><input class="finput" id="r-temp" placeholder="38.2"></div>
                  <div class="fg"><label class="flabel">Pulse bpm</label><input class="finput" id="r-pulse" placeholder="88"></div>
                  <div class="fg"><label class="flabel">O₂ sat %</label><input class="finput" id="r-o2" placeholder="96"></div>
                </div>
              </div>
            </div>

            <div class="card mb10">
              <div class="card-header"><div class="card-title">Messaging on registration</div><span class="ib-badge">Infobip</span></div>
              <div class="card-body" style="display:flex;flex-direction:column;gap:8px;">
                <label style="display:flex;align-items:center;gap:8px;color:var(--text2);"><input type="checkbox" id="chk-sms" checked> Send SMS confirmation</label>
                <label style="display:flex;align-items:center;gap:8px;color:var(--text2);"><input type="checkbox" id="chk-wa" checked> Send WhatsApp confirmation</label>
              </div>
            </div>

            <div style="display:flex;gap:8px;justify-content:flex-end;">
              <button class="btn" onclick="clearReg()">Clear</button>
              <button class="btn btn-primary" id="reg-btn" onclick="registerPatient()">Register & Add to Queue</button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ==========================================
// 1. DATABASE CONFIGURATION
// ==========================================
const SB_URL = "YOUR_SUPABASE_PROJECT_URL"; 
const SB_ANON = "YOUR_SUPABASE_ANON_KEY";

// CORRECT CDN INITIALIZATION BLUEPRINT
const db = supabase.createClient(SB_URL, SB_ANON);

let selectedTriage = 'Routine'; // Fallback default

// Triage Selection UI Styling Manager
function selTriage(level) {
  selectedTriage = level;
  document.querySelectorAll('.tcard').forEach(c => c.classList.remove('selected', 'critical', 'urgent', 'routine', 'booked'));
  
  const activeCard = document.getElementById(`tc-${level.toLowerCase().replace('-','')}`);
  if(activeCard) {
    activeCard.classList.add('selected', level.toLowerCase().replace('-',''));
  }
}

// Clear Form Input Utility
function clearReg() {
  document.querySelectorAll('.finput').forEach(input => input.value = '');
  selectedTriage = 'Routine';
  selTriage('Routine');
}

// ==========================================
// 2. FORM SUBMISSION PIPELINE
// ==========================================
async function registerPatient() {
  const submitBtn = document.getElementById('reg-btn');
  submitBtn.disabled = true;
  submitBtn.innerText = "Saving to Queue...";

  // Get form text inputs
  const first_name = document.getElementById('r-first').value.trim();
  const surname = document.getElementById('r-last').value.trim();
  const sa_id_passport = document.getElementById('r-id').value.trim();
  const date_of_birth = document.getElementById('r-dob').value || new Date().toISOString().split('T')[0];
  const phone = document.getElementById('r-phone').value.trim();
  const gender = document.getElementById('r-gender').value || 'Prefer not to say';
  const chief_complaint = document.getElementById('r-complaint').value.trim();
  const department = document.getElementById('r-dept').value;
  const visit_type = document.getElementById('r-type').value;

  // Get quick vitals numerical entries
  const blood_pressure = document.getElementById('r-bp').value.trim() || null;
  const temperature_c = parseFloat(document.getElementById('r-temp').value) || null;
  const pulse_bpm = parseInt(document.getElementById('r-pulse').value) || null;
  const o2_sat_percent = parseInt(document.getElementById('r-o2').value) || null;

  // Check messaging settings toggles
  const send_sms_confirmation = document.getElementById('chk-sms').checked;
  const send_whatsapp_confirmation = document.getElementById('chk-wa').checked;

  // Simple validation block
  if (!first_name || !surname || !phone || !chief_complaint) {
    alert("Please fill in all mandatory fields marked with *");
    submitBtn.disabled = false;
    submitBtn.innerText = "Register & Add to Queue";
    return;
  }

  try {
    // Send directly to the patients_queue database table instance
    const { data, error } = await db
      .from('patients_queue')
      .insert([
        {
          first_name,
          surname,
          sa_id_passport,
          date_of_birth,
          phone,
          gender,
          chief_complaint,
          department,
          visit_type,
          triage_status: selectedTriage,
          blood_pressure,
          temperature_c,
          pulse_bpm,
          o2_sat_percent,
          send_sms_confirmation,
          send_whatsapp_confirmation
        }
      ]);

    if (error) {
      alert("Supabase Error: " + error.message);
      console.error(error);
    } else {
      alert("🎉 Patient added to HealthQue successfully!");
      clearReg();
    }
  } catch (err) {
    alert("Connection error occurred. Double check your API Keys.");
    console.error(err);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerText = "Register & Add to Queue";
  }
}

// Auto-run UI configuration defaults on system boot
selTriage('Routine');
</script>

</body>
</html>
